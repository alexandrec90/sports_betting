# Per-project config for the vendored agent-harness hook scripts
# (scripts/hooks/*.py). Those scripts are byte-identical across every project;
# everything project-specific lives here. Loaded by scripts/hooks/harness_config.py.
# Schema + neutral defaults: that module's dataclasses.
#
# Generated by devkit's `new-project.py`. This file is deliberately NOT in
# sync-devkit.py's MANIFEST — it is the per-project seam, so editing it here is
# correct and will never be reported as drift.

[project]
# Prefix for the harness control env vars:
#   SPORTS_BETTING_SKIP_STOP_VERIFY, SPORTS_BETTING_STOP_TESTS_AUTOSTART
env_prefix = "SPORTS_BETTING"

[paths]
app = "sports_betting/"
tests = "tests/"
unit_tests = "tests"

# The PreToolUse Bash output cap. `enforce-capped-bash.py` blocks an uncapped Bash
# call and quotes `max_bytes` in the reason; `invoke-capped.py` applies it. One
# field feeds both, so the number the agent is told to use is the number it gets.
#
# `head_bytes` is the share of the cap given to the START of the output; the rest
# goes to the tail. Both windows are kept because the useful parts of a long
# command's output are the first lines (what ran) and the last (how it failed).
[bash]
max_bytes = 4000
head_bytes = 2000

# Tier 2b: host pytest against the DB over its published compose port.
#
# NOTE the port. `db_port` is the *host* port, so it differs per worktree — this
# file is committed and shared across worktrees, which means the value below is
# only right for the primary checkout. A worktree stack publishes
# `5436 + its slot` (see devkit's ports.toml); if you run host pytest from
# a worktree, export DB_HOST_PORT to override.
[db]
enabled = true
services = ["db"]
db_service = "db"
db_port = 5436
# Mirrors docker-compose.yml's POSTGRES_* and the PR gate's env block.
user = "sports_betting"
password = "sports_betting_local_dev" # pragma: allowlist secret
name = "sports_betting"
url_scheme = "postgresql+psycopg"
url_env = ["DATABASE_URL"]

# Extra env for host pytest: name -> default. An already-set os.environ wins.
[db.test_env]

[frontend]
enabled = false

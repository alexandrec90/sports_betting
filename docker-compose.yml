# The local stack.
#
# EVERY published port is a `${*_HOST_PORT:-<conventional default>}` variable, never
# a literal. That is what lets a parallel `git worktree` bring up a second stack
# without editing this file: it sets the offsets in its own `.env`. A hardcoded port
# here is the bug that makes two checkouts un-runnable at the same time — the
# defaults exist so a bare clone with no `.env` still works.
#
# Containers, network, and volumes are namespaced by COMPOSE_PROJECT_NAME (set in
# `.env`, and it must equal the checkout's directory name).

services:
  collector:
    build:
      context: .
      target: prod
    restart: unless-stopped
    command: ["sports-betting", "serve"]
    # `.dockerignore` keeps `.env` out of the image, so this block IS the collector's
    # configuration: a setting not listed here is a `.env` line the container ignores.
    # Defaults must equal `Settings`' — tests/test_compose_env.py enforces both.
    environment:
      ARCHIVE_ROOT: /data-lake/archive
      SPORTSDB_API_KEY: ${SPORTSDB_API_KEY:-123}
      SPORTSDB_TIMEOUT_SECONDS: ${SPORTSDB_TIMEOUT_SECONDS:-20}
      SPORTSDB_SPORTS: ${SPORTSDB_SPORTS:-Soccer,Baseball,Basketball,Ice Hockey,American Football}
      FOOTBALL_DATA_API_KEY: ${FOOTBALL_DATA_API_KEY:-}
      BALLDONTLIE_API_KEY: ${BALLDONTLIE_API_KEY:-}
      BALLDONTLIE_SPORTS: ${BALLDONTLIE_SPORTS:-nba,nfl,mlb}
      THE_ODDS_API_KEY: ${THE_ODDS_API_KEY:-}
      THE_ODDS_API_SPORTS: ${THE_ODDS_API_SPORTS:-icehockey_nhl,americanfootball_nfl,basketball_nba,baseball_mlb,americanfootball_cfl,americanfootball_ncaaf,soccer_epl,soccer_uefa_champs_league,soccer_spain_la_liga,soccer_italy_serie_a,soccer_germany_bundesliga,soccer_france_ligue_one,soccer_usa_mls,tennis_atp_*,tennis_wta_*}
      THE_ODDS_API_REGIONS: ${THE_ODDS_API_REGIONS:-us}
      THE_ODDS_API_MONTHLY_BUDGET: ${THE_ODDS_API_MONTHLY_BUDGET:-450}
      THE_ODDS_API_LOOKAHEAD_HOURS: ${THE_ODDS_API_LOOKAHEAD_HOURS:-36}
      ODDS_REFRESH_FILE: /app/logs/odds-api-refresh.json
      API_SPORTS_KEY: ${API_SPORTS_KEY:-}
      API_SPORTS_DAILY_BUDGET: ${API_SPORTS_DAILY_BUDGET:-90}
      API_SPORTS_DAYS: ${API_SPORTS_DAYS:-2}
      API_SPORTS_BET: ${API_SPORTS_BET:-1}
      API_SPORTS_MAX_PAGES: ${API_SPORTS_MAX_PAGES:-3}
      API_SPORTS_LEAGUES: ${API_SPORTS_LEAGUES:-39,140,135,78,61,253,479,262,40,88,179,71,128,141,41,42,218,197,239,265,292}
      API_SPORTS_REFRESH_FILE: /app/logs/api-sports-refresh.json
      COLLECTION_INTERVAL_HOURS: ${COLLECTION_INTERVAL_HOURS:-6}
      SCHEDULER_HEALTH_FILE: /app/logs/scheduler-health.json
      PROVIDER_QUOTA_FILE: /app/logs/provider-quotas.json
      BULK_REQUEST_INTERVAL_SECONDS: ${BULK_REQUEST_INTERVAL_SECONDS:-1}
      BULK_MAX_DOWNLOAD_BYTES: ${BULK_MAX_DOWNLOAD_BYTES:-2000000000}
      BULK_REFRESH_ENABLED: ${BULK_REFRESH_ENABLED:-false}
      BULK_REFRESH_SOURCES: ${BULK_REFRESH_SOURCES:-football-data,nflverse,moneypuck}
      BULK_FOOTBALL_LEAGUES: ${BULK_FOOTBALL_LEAGUES:-E0,D1,I1,SP1,F1}
      STATSBOMB_REFRESH_TARGETS: ${STATSBOMB_REFRESH_TARGETS:-}
    volumes:
      - ../data-lake/data:/data-lake
      - ./logs:/app/logs
    mem_limit: 512m

  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sports_betting}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sports_betting_local_dev}
      POSTGRES_DB: ${POSTGRES_DB:-sports_betting}
    ports:
      - "${DB_HOST_PORT:-5436}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # Other services wait on this, so `up -d` returning means the DB is actually
      # accepting connections — not merely that the container started.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sports_betting}"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 512m

volumes:
  pgdata:

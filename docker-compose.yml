# The local stack.
#
# EVERY published port is a `${*_HOST_PORT:-<conventional default>}` variable, never
# a literal. That is what lets a parallel `git worktree` bring up a second stack
# without editing this file: it sets the offsets in its own `.env`. A hardcoded port
# here is the bug that makes two checkouts un-runnable at the same time — the
# defaults exist so a bare clone with no `.env` still works.
#
# Containers, network, and volumes are namespaced by COMPOSE_PROJECT_NAME (set in
# `.env`, and it must equal the checkout's directory name).

services:
  collector:
    build:
      context: .
      target: prod
    restart: unless-stopped
    command: ["sports-betting", "serve"]
    environment:
      ARCHIVE_ROOT: /data-lake/archive
      SPORTSDB_API_KEY: ${SPORTSDB_API_KEY:-123}
      SPORTSDB_TIMEOUT_SECONDS: ${SPORTSDB_TIMEOUT_SECONDS:-20}
      SPORTSDB_SPORTS: ${SPORTSDB_SPORTS:-Soccer,Baseball,Basketball,Ice Hockey,American Football}
      FOOTBALL_DATA_API_KEY: ${FOOTBALL_DATA_API_KEY:-}
      BALLDONTLIE_API_KEY: ${BALLDONTLIE_API_KEY:-}
      BALLDONTLIE_SPORTS: ${BALLDONTLIE_SPORTS:-nba,nfl,mlb,epl}
      THE_ODDS_API_KEY: ${THE_ODDS_API_KEY:-}
      THE_ODDS_API_SPORTS: ${THE_ODDS_API_SPORTS:-basketball_nba,baseball_mlb}
      COLLECTION_INTERVAL_HOURS: ${COLLECTION_INTERVAL_HOURS:-6}
      SCHEDULER_HEALTH_FILE: /app/logs/scheduler-health.json
      PROVIDER_QUOTA_FILE: /app/logs/provider-quotas.json
    volumes:
      - ../data-lake/data:/data-lake
      - ./logs:/app/logs
    mem_limit: 512m

  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sports_betting}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sports_betting_local_dev}
      POSTGRES_DB: ${POSTGRES_DB:-sports_betting}
    ports:
      - "${DB_HOST_PORT:-5436}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # Other services wait on this, so `up -d` returning means the DB is actually
      # accepting connections — not merely that the container started.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sports_betting}"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 512m

volumes:
  pgdata:
